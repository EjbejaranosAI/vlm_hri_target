# vlm_hri_node — TIAGO real.
# Uso: ros2 launch vlm_hri_target vlm_hri.launch.py profile:=robot
#
# dynamic_tracking en robot real publica las posiciones en el frame `odom`
# (ver dynamic-tracking/README.md, tabla "Simulation vs robot": tracking_frame:
# odom en robot). Mismo comentario que el YAML de sim: frame_id debe
# coincidir con el tracking_frame real de dynamic_tracking, vlm_hri_node no
# transforma nada por su cuenta.

vlm_hri_node:
  ros__parameters:
    image_topic: "/head_front_camera/color/image_raw"
    detections_topic: "/detections/tracked_fov"
    use_dynamic_tracking: true  # false = solo cámara, detección/tracking propios (sin LiDAR)
    image_qos_reliability: "best_effort"
    frame_id: "odom"
    chunk_sec: 1.0
    # assumed_fps ya NO se usa tal cual: vlm_hri_node mide el fps real de
    # llegada de frames (evento, no ritmo fijo -- con dynamic_tracking depende
    # de SU pipeline, ~9-10Hz medido, no de este número) durante los primeros
    # fps_calibration_samples callbacks, y usa esa medida en su lugar. Este
    # valor solo se usa como último recurso si la medición falla (span<=0).
    assumed_fps: 30.0
    fps_calibration_samples: 20
    use_pose: true
    draw_pose: false
    sync_slop_sec: 0.10
    # Filtro temporal del target (vlm_hri/target_filter.py). Todos los modos se
    # calculan siempre y salen en /vlm_hri/target_filter (grabar con rosbag
    # para comparar); target_filter elige cuál va a /vlm_hri/target_pose:
    #   raw  = target del VLM tal cual, trozo a trozo (comportamiento previo)
    #   ema  = argmax de la EMA de votos (incluye "nadie" como clase)
    #   hyst = EMA + histéresis (cambia si es líder en min_stable de los últimos
    #          stable_window trozos y > enter; suelta si < exit, si pasa a
    #          MOVING o si no se ve > absent_chunks)
    #   ema_c      = EMA por persona de P(ATTENTIVE)+P(AVAILABLE) (JEV)
    #   ema_c_hyst = ema_c + la misma histéresis
    #   bayes      = filtro de Bayes discreto sobre la misma evidencia
    #   auto       = ema_c_hyst con VLM_BACKEND=vlm_jev, hyst con el VLM generativo
    target_filter: "raw"
    target_ema_alpha: 0.5
    target_enter_threshold: 0.5
    target_exit_threshold: 0.25
    target_min_stable: 2
    target_stable_window: 0   # 0 = min_stable (seguidos); p. ej. 4 = 2 de los últimos 4
    target_absent_chunks: 2
    # Si el VLM dice target=null pero él mismo marcó a alguien ATTENTIVE/
    # AVAILABLE (se contradice), se vota por ese pid con este peso en vez de
    # por "nadie". 0.5: alcanza para CONSERVAR el target, no para crearlo.
    # 0 = desactivado.
    target_fallback_weight: 0.5
